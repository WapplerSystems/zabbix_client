              name: 'TYPO3 Composer security advisories on {HOST.NAME}'
              opdata: '{ITEM.LASTVALUE1} advisories'
              priority: HIGH
              description: 'composer audit found advisories for installed packages. Details: item ''TYPO3 Composer security advisories (list)''.'
