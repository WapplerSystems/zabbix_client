  triggers:
    - uuid: b6671967cb5147348c1e1d7c140f1011
      expression: 'min(/Template Frontend Performance/web.test.time[Frontend Performance,Startseite,resp],5m)>{$FRONTEND.RESP.WARN}'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'max(/Template Frontend Performance/web.test.time[Frontend Performance,Startseite,resp],5m)<{$FRONTEND.RESP.WARN}*0.8'
      name: 'Frontend: Startseite langsam (>{$FRONTEND.RESP.WARN}s)'
      opdata: 'Antwortzeit: {ITEM.LASTVALUE1}'
      priority: WARNING
      description: 'Die Antwortzeit der Startseite lag ueber 5 Minuten durchgehend ueber {$FRONTEND.RESP.WARN}s.'
      dependencies:
        - name: 'Frontend: Startseite nicht erreichbar'
          expression: 'min(/Template Frontend Performance/web.test.fail[Frontend Performance],#2)>0'
        - name: 'Frontend: Startseite sehr langsam (>{$FRONTEND.RESP.HIGH}s)'
          expression: 'min(/Template Frontend Performance/web.test.time[Frontend Performance,Startseite,resp],5m)>{$FRONTEND.RESP.HIGH}'
          recovery_expression: 'max(/Template Frontend Performance/web.test.time[Frontend Performance,Startseite,resp],5m)<{$FRONTEND.RESP.HIGH}*0.8'
      tags:
        - tag: component
          value: frontend
        - tag: scope
          value: performance
    - uuid: 54298360bc7249e1a45136ea1931e0da
      expression: 'min(/Template Frontend Performance/web.test.fail[Frontend Performance],#2)>0'
      name: 'Frontend: Startseite nicht erreichbar'
      opdata: '{ITEM.LASTVALUE2}'
      priority: HIGH
      description: 'Das Web-Szenario konnte die Startseite in zwei aufeinanderfolgenden Durchlaeufen nicht mit HTTP 200 abrufen.'
      manual_close: 'YES'
      tags:
        - tag: component
          value: frontend
        - tag: scope
          value: availability
    - uuid: fc62b98c05174109aa61d2925fa22bd5
      expression: 'min(/Template Frontend Performance/web.test.time[Frontend Performance,Startseite,resp],5m)>{$FRONTEND.RESP.HIGH}'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'max(/Template Frontend Performance/web.test.time[Frontend Performance,Startseite,resp],5m)<{$FRONTEND.RESP.HIGH}*0.8'
      name: 'Frontend: Startseite sehr langsam (>{$FRONTEND.RESP.HIGH}s)'
      opdata: 'Antwortzeit: {ITEM.LASTVALUE1}'
      priority: AVERAGE
      description: 'Die Antwortzeit der Startseite lag ueber 5 Minuten durchgehend ueber {$FRONTEND.RESP.HIGH}s.'
      dependencies:
        - name: 'Frontend: Startseite nicht erreichbar'
          expression: 'min(/Template Frontend Performance/web.test.fail[Frontend Performance],#2)>0'
      tags:
        - tag: component
          value: frontend
        - tag: scope
          value: performance
    - uuid: e04aaedcc10c4b8594dc4522f580541b
      expression: 'length(last(/Template TYPO3 9-14/web.test.error[Frontend]))>0 and min(/Template TYPO3 9-14/web.test.fail[Frontend],5m)>0'
