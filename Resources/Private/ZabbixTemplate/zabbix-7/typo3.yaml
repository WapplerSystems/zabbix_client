zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: e7752236596b41a9a09e3d3b7f237947
      template: 'Template Frontend Performance'
      name: 'Template Frontend Performance'
      description: 'Allgemeiner Frontend-Check der Startseite per Web-Szenario. Misst Antwortzeit, Download-Geschwindigkeit und HTTP-Status. URL wird aus dem Default-Interface des Hosts gebildet ({HOST.CONN}); abweichende Pfade ueber {$FRONTEND.PATH}, abweichendes Schema ueber {$FRONTEND.SCHEME}.'
      groups:
        - name: Templates/Applications
      httptests:
        - uuid: f4f62850f6ef47bfa9fb20ecf5c4a7d0
          name: 'Frontend Performance'
          steps:
            - name: Startseite
              url: '{$FRONTEND.SCHEME}://{HOST.CONN}{$FRONTEND.PATH}'
              posts: ''
              status_codes: '200'
          tags:
            - tag: Application
              value: Frontend
            - tag: scope
              value: performance
      macros:
        - macro: '{$FRONTEND.PATH}'
          value: /
          description: 'Pfad der zu pruefenden Startseite'
        - macro: '{$FRONTEND.RESP.HIGH}'
          value: '5'
          description: 'Antwortzeit Startseite in s, ab der eskaliert wird'
        - macro: '{$FRONTEND.RESP.WARN}'
          value: '2'
          description: 'Antwortzeit Startseite in s, ab der gewarnt wird'
        - macro: '{$FRONTEND.SCHEME}'
          value: https
          description: 'Protokoll fuer den Frontend-Check'
    - uuid: b19712d20f9344d3a057e0e0585e4cce
      template: 'Template TYPO3 9-14'
      name: 'Template TYPO3 9-14'
      templates:
        - name: 'HTTP Service'
        - name: 'Template Frontend Performance'
      groups:
        - name: Templates/Applications
      items:
        - uuid: 4b6e93b0f1a24cd482617a0d3464e047
          name: 'TYPO3 Composer abandoned packages'
          type: DEPENDENT
          key: typo3_ComposerAudit_abandoned
          history: 90d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.value.abandonedCount
              error_handler: DISCARD_VALUE
          master_item:
            key: typo3_GetComposerAudit
          tags:
            - tag: Application
              value: Composer
            - tag: Application
              value: TYPO3
        - uuid: cc06b241c88e46d5882259e674da842e
          name: 'TYPO3 Composer security advisories (list)'
          type: DEPENDENT
          key: typo3_ComposerAudit_list
          history: 30d
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.value.advisories
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - 'var a = JSON.parse(value); var l = []; for (var i = 0; i < a.length; i++) { var x = a[i]; l.push(x.package + '' '' + x.cve + '': '' + x.title + '' '' + x.link); } return l.length ? l.join(''\n'') : ''none'';'
          master_item:
            key: typo3_GetComposerAudit
          tags:
            - tag: Application
              value: Composer
            - tag: Application
              value: TYPO3
        - uuid: 56ccd4c92c4f4c9a9938cb989531dccf
          name: 'TYPO3 Composer audit check OK'
          type: DEPENDENT
          key: typo3_ComposerAudit_ok
          history: 30d
          description: '1 = composer audit ran, 0 = it failed (reason in the raw item).'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.parse(value).status ? 1 : 0;'
          master_item:
            key: typo3_GetComposerAudit
          tags:
            - tag: Application
              value: Composer
            - tag: Application
              value: TYPO3
          triggers:
            - uuid: 89ded502928842298e92790f78e9e7bf
              expression: 'max(/Template TYPO3 9-14/typo3_ComposerAudit_ok,#3)=0'
              name: 'TYPO3 Composer audit failing on {HOST.NAME}'
              priority: INFO
              description: 'composer audit failed three times in a row - vulnerabilities are not checked. Reason in item ''TYPO3 Composer audit (raw)''. Raise to Warning once all hosts run zabbix_client >= 14.2.4.'
              tags:
                - tag: Application
                  value: Composer
        - uuid: 1d68083510a64adbac8272996c35cfb8
          name: 'TYPO3 Composer security advisories'
          type: DEPENDENT
          key: typo3_ComposerAudit_vulnerabilities
          history: 90d
          description: 'Number of security advisories affecting installed composer packages. Keeps its last value while the check fails.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.value.vulnerabilities
              error_handler: DISCARD_VALUE
          master_item:
