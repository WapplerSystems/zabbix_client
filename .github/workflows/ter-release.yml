name: publish
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to publish to TER (e.g. 14.2.2)'
        required: true
jobs:
  publish:
    name: Publish new version to TER
    runs-on: ubuntu-latest
    env:
      TYPO3_EXTENSION_KEY: ${{ secrets.TYPO3_EXTENSION_KEY }}
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Check tag
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            exit 1
          fi

      - name: Get comment
        run: |
          # actions/checkout fetches tags as lightweight refs; refetch to read the annotation
          git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
          comment=$(git tag -l --format='%(contents)' "$VERSION")

          if [[ -z "${comment// }" ]]; then
            echo "comment=Released version $VERSION of $TYPO3_EXTENSION_KEY" >> $GITHUB_ENV
          else
            {
              echo 'comment<<EOF'
              echo "$comment"
              echo EOF
            } >> "$GITHUB_ENV"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Install tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress

      - name: Publish to TER
        run: php ~/.composer/vendor/bin/tailor ter:publish --comment "${{ env.comment }}" "$VERSION"
